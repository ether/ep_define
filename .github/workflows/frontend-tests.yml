# Publicly credit Sauce Labs because they generously support open source
# projects.
name: Frontend Tests

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      -
        name: Check out Etherpad core
        uses: actions/checkout@v6
        with:
          repository: ether/etherpad-lite
          path: etherpad-lite
      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: 25
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Checkout plugin repository
        uses: actions/checkout@v6
        with:
          path: plugin
      -
        name: Install Etherpad core dependencies
        working-directory: ./etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path ../../plugin
      - name: Create settings.json
        working-directory: ./etherpad-lite
        run: cp ./src/tests/settings.json settings.json
      - name: Run the frontend tests
        working-directory: ./etherpad-lite
        shell: bash
        run: |
          pnpm run dev > /tmp/devserver.log 2>&1 &
          connected=false
          can_connect() {
            curl -sSfo /dev/null http://localhost:9001/ || return 1
            connected=true
          }
          now() { date +%s; }
          start=$(now)
          while [ $(($(now) - $start)) -le 30 ] && ! can_connect; do
            sleep 1
          done
          # DIAGNOSTIC: directly load a pad page server-side, capture status
          sleep 15
          echo "===== curl /p/diagpad (status) ====="
          curl -s -o /tmp/padpage.html -w "HTTP %{http_code} size=%{size_download}\n" "http://localhost:9001/p/diagpad12345"
          echo "--- pad page entrypoint script tag ---"
          grep -oE '/watch/pad[^"]*' /tmp/padpage.html | head -1
          echo "===== curl /watch/pad ====="
          curl -s "http://localhost:9001/watch/pad?hash=x" -o /tmp/watchpad.js -w "HTTP %{http_code} size=%{size_download}\n"
          echo "===== server log: routeHandlers / errors so far ====="
          grep -nE "routeHandlers|is not a function|\[ERROR\]" /tmp/devserver.log | grep -viE "update check|fetch failed" | head -30 || true
          cd src
          pnpm exec playwright install chromium --with-deps
          # DIAGNOSTIC: only ep_define spec, single retry, capture artifacts
          pnpm run test-ui --project=chromium --retries=1 --max-failures=4 \
            define.spec || true
          echo "===== server log AFTER tests: errors during pad loads ====="
          grep -nE "routeHandlers|is not a function|\[ERROR\]|\[ENTER\]|\[LEAVE\]|CLIENT_READY|disconnect" /tmp/devserver.log | grep -viE "update check|fetch failed" | tail -40 || true
      - name: Stage diagnostic logs
        if: always()
        working-directory: ./etherpad-lite
        run: cp /tmp/devserver.log ./devserver.log || true
      - name: Upload Playwright traces (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-traces
          path: |
            etherpad-lite/src/test-results/**
            etherpad-lite/src/playwright-report/**
            etherpad-lite/devserver.log
            
          if-no-files-found: warn
          retention-days: 3
