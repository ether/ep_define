# Publicly credit Sauce Labs because they generously support open source
# projects.
name: Frontend Tests

on:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      -
        name: Check out Etherpad core
        uses: actions/checkout@v6
        with:
          repository: ether/etherpad-lite
          path: etherpad-lite
      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: 25
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          package_json_file: ./etherpad-lite/package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Checkout plugin repository
        uses: actions/checkout@v6
        with:
          path: plugin
      -
        name: Install Etherpad core dependencies
        working-directory: ./etherpad-lite
        run: bin/installDeps.sh
      - name: Install plugin
        working-directory: ./etherpad-lite
        run: |
          pnpm run plugins i --path ../../plugin
      - name: Create settings.json
        working-directory: ./etherpad-lite
        run: cp ./src/tests/settings.json settings.json
      - name: Run the frontend tests
        working-directory: ./etherpad-lite
        shell: bash
        run: |
          pnpm run dev > /tmp/devserver.log 2>&1 &
          connected=false
          can_connect() {
            curl -sSfo /dev/null http://localhost:9001/ || return 1
            connected=true
          }
          now() { date +%s; }
          start=$(now)
          while [ $(($(now) - $start)) -le 30 ] && ! can_connect; do
            sleep 1
          done
          # DIAGNOSTIC: probe the editor bundle + a pad page directly
          sleep 8
          echo "===== /watch/pad bundle size ====="
          curl -s "http://localhost:9001/watch/pad?hash=x" -o /tmp/watchpad.js
          wc -c /tmp/watchpad.js
          echo "ep_define occurrences in bundle: $(grep -c ep_define /tmp/watchpad.js || true)"
          head -c 400 /tmp/watchpad.js; echo
          echo "===== first 200 lines of dev server log ====="
          head -200 /tmp/devserver.log
          echo "===== esbuild/build errors in dev log ====="
          grep -iE "esbuild|could not resolve|transform failed|build failed|✘|error" /tmp/devserver.log | head -40 || true
          cp /tmp/devserver.log etherpad-lite/devserver.log || true
          cp /tmp/watchpad.js etherpad-lite/watchpad.js || true
          cd src
          pnpm exec playwright install chromium --with-deps
          # DIAGNOSTIC: only ep_define spec, single retry, capture artifacts
          pnpm run test-ui --project=chromium --retries=1 --max-failures=4 \
            define.spec || true
      - name: Upload Playwright traces (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-traces
          path: |
            etherpad-lite/src/test-results/**
            etherpad-lite/src/playwright-report/**
            etherpad-lite/devserver.log
            etherpad-lite/watchpad.js
          if-no-files-found: warn
          retention-days: 3
